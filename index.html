<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:#8fd9ff;font-family:'Fredoka',sans-serif;overflow:hidden;overscroll-behavior:none}
#canvasWrap{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}

.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;background:radial-gradient(ellipse at 50% 30%, rgba(255,255,255,.9) 0%, rgba(143,217,255,.6) 55%, rgba(143,217,255,.95) 100%);transition:transform .35s cubic-bezier(.34,1.56,.64,1), opacity .3s}
.overlay.hidden{transform:scale(1.15);opacity:0;pointer-events:none}
.title{font-weight:800;line-height:.9;text-align:center;transform:rotate(-3deg);text-shadow:6px 6px 0 #1a1a1a,-1px -1px 0 #1a1a1a,1px -1px 0 #1a1a1a,-1px 1px 0 #1a1a1a,1px 1px 0 #1a1a1a}
.title span{display:block}
.title .t1{font-size:clamp(42px,11vw,92px);color:#ffed4a;-webkit-text-stroke:4px #1a1a1a}
.title .t2{font-size:clamp(38px,10vw,84px);color:#fff;-webkit-text-stroke:4px #1a1a1a;margin-top:-6px}
.subtitle{margin:18px 0 22px;font-size:18px;background:#1a1a1a;color:#fff;padding:6px 14px;border-radius:999px;transform:rotate(-1deg)}
.btn{font-family:'Press Start 2P',monospace;background:#ffed4a;border:4px solid #1a1a1a;border-radius:18px;padding:16px 32px;font-size:18px;box-shadow:6px 6px 0 #1a1a1a;cursor:pointer;transition:transform .08s, box-shadow .08s;pointer-events:auto}
.btn:active{transform:translate(3px,3px);box-shadow:3px 3px 0 #1a1a1a}
.btn-small{font-size:12px;padding:10px 18px;border-radius:12px}
.hint{margin-top:18px;font-family:'Press Start 2P',monospace;font-size:9px;opacity:.7;letter-spacing:.5px;text-align:center;line-height:1.6}
#gameOverScreen .big{font-family:'Press Start 2P',monospace;font-size:clamp(28px,8vw,56px);color:#ff4a4a;-webkit-text-stroke:3px #1a1a1a;text-shadow:5px 5px 0 #1a1a1a;transform:rotate(-2deg)}
#finalScore{margin:14px 0 20px;font-family:'Press Start 2P',monospace;font-size:14px;background:#fff;border:3px solid #1a1a1a;border-radius:12px;padding:10px 18px;box-shadow:4px 4px 0 #1a1a1a}
#finalScore b{font-size:20px}
#mobileCtrl{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:11;pointer-events:auto}
.mBtn{width:56px;height:56px;background:rgba(255,255,255,.92);border:3px solid #1a1a1a;border-radius:16px;box-shadow:4px 4px 0 #1a1a1a;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;cursor:pointer}
.mBtn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #1a1a1a}
@media(min-width:800px){#mobileCtrl{display:none}}
#progress{position:fixed;left:12px;top:50%;transform:translateY(-50%);width:10px;height:42vh;background:rgba(0,0,0,.15);border:2px solid #1a1a1a;border-radius:999px;overflow:hidden;z-index:9}
#progressBar{position:absolute;bottom:0;width:100%;background:#ffed4a;transition:height .2s}
.eagle{position:fixed;top:-20%;left:50%;font-size:80px;z-index:15;pointer-events:none;transition:transform 1.2s cubic-bezier(.6,.1,.9,.4);transform:translate(-50%,-100%) rotate(15deg)}
.eagle.show{transform:translate(-50%,120vh) rotate(25deg)}
</style>
</head>
<body>
<div id="canvasWrap"></div>
<div id="hud">
  <div class="hud-pill"><span id="score">0</span></div>
  <div class="hud-pill"><span style="width:14px;height:14px;background:#ffde2e;border:2px solid #1a1a1a;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#d00">C</span><span id="coinCount">0</span></div>
</div>
<div id="progress"><div id="progressBar" style="height:8%"></div></div>

<div id="startScreen" class="overlay">
  <div class="title"><span class="t1">CROSSY</span><span class="t2">CHICKEN</span></div>
  <div class="subtitle">hop • dodge • float • collect!</div>
  <button id="playBtn" class="btn">PLAY ▶</button>
  <div class="hint">WASD / ARROWS / SWIPE TO HOP<br>GRASS = SAFE &nbsp; ROAD = CARS &nbsp; RIVER = LOGS<br>GRAB THE YELLOW C-COINS!</div>

<script type="module">
import * as THREE from 'three';

let scene,camera,renderer,dirLight,ambient;
let player, playerGroup, playerShadow;
let lanes=[], coins=[], particles=[];
let gridX=0, gridZ=0, targetX=0, targetZ=0, startX=0, startZ=0;
let isHopping=false, hopT=0;
let score=0,best=0,coinScore=0, maxZ=0;
let gameState='start';
let clock=new THREE.Clock();
let laneOffset=0;
let audioCtx;
let idleTime=0, onLog=null, lastLog=null;
let camTarget=new THREE.Vector3();
let shake=0;
const TILE=1.05;
const WORLD_W=13;
const SAFE_START=6;

const $score=document.getElementById('score');
const $coin=document.getElementById('coinCount');
const $pBar=document.getElementById('progressBar');
const $eagle=document.getElementById('eagle');

function audioInit(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
function tone(f, dur, type='square', vol=0.2){
  try{
    audioInit();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch{}
}
function playHop(){ tone(420,0.12,'square',0.18); setTimeout(()=>tone(620,0.08,'square',0.12),60); }
function playCoin(){ tone(800,0.12,'sine',0.25); setTimeout(()=>tone(1200,0.2,'sine',0.2),80); }
function playCrash(){ tone(180,0.35,'sawtooth',0.3); setTimeout(()=>tone(70,0.4,'sawtooth',0.3),120); }
function playSplash(){ tone(300,0.3,'triangle',0.2); setTimeout(()=>tone(150,0.4,'triangle',0.2),100); }

function makeVoxelBox(w,h,d,color){
  const g=new THREE.BoxGeometry(w,h,d);
  const m=new THREE.MeshLambertMaterial({color});
  const mesh=new THREE.Mesh(g,m);
  mesh.castShadow=true; mesh.receiveShadow=true;
  return mesh;
}

function createChicken(){
  const g=new THREE.Group();
  const body=makeVoxelBox(0.7,0.5,0.75,0xffffff);
  body.position.y=0.45; g.add(body);
  const head=makeVoxelBox(0.52,0.48,0.52,0xffffff);
  head.position.set(0,0.88,0.22); g.add(head);
  const comb=makeVoxelBox(0.14,0.22,0.22,0xff3b3b);
  comb.position.set(0,1.2,0.22); g.add(comb);
  const beak=makeVoxelBox(0.18,0.14,0.22,0xff9f1a);
  beak.position.set(0,0.84,0.58); g.add(beak);
  const eyeL=makeVoxelBox(0.08,0.08,0.06,0x111111); eyeL.position.set(-0.18,0.92,0.48); g.add(eyeL);
  const eyeR=eyeL.clone(); eyeR.position.x=0.18; g.add(eyeR);
  const wingL=makeVoxelBox(0.12,0.28,0.38,0xffffff); wingL.position.set(-0.42,0.5,0); g.add(wingL);
  const wingR=wingL.clone(); wingR.position.x=0.42; g.add(wingR);
  const footL=makeVoxelBox(0.18,0.12,0.24,0xff7a18); footL.position.set(-0.18,0.12,-0.05); g.add(footL);
  const footR=footL.clone(); footR.position.x=0.18; g.add(footR);
  const shadow=new THREE.Mesh(new THREE.PlaneGeometry(0.9,0.9), new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.18}));
  shadow.rotation.x=-Math.PI/2; shadow.position.y=0.01;
  g.add(shadow);
  g.position.set(0,0,0);
  return g;
}

function createTree(x,z){
  const group=new THREE.Group();
  const trunk=makeVoxelBox(0.32,0.7,0.32,0x5d4037);
  trunk.position.y=0.35; group.add(trunk);
  const colors=[0x8bc34a,0x7cb342,0x9ccc65];
  const c=colors[Math.floor(Math.random()*colors.length)];
  const leaves=makeVoxelBox(0.85,0.85,0.85,c);
  leaves.position.y=1.05; group.add(leaves);
  const leaves2=makeVoxelBox(0.65,0.5,0.65,c);
  leaves2.position.y=1.55; group.add(leaves2);
  group.position.set(x*TILE,0,z);
  group.userData={type:'tree', x};
  return group;
}
function createRock(x,z){
  const g=new THREE.Group();
  const m=makeVoxelBox(0.6,0.45,0.6,0x9e9e9e);
  m.position.y=0.22; g.add(m);
  g.position.set(x*TILE,0,z);
  g.userData={type:'rock',x};
  return g;
}
function createCar(color, dir){
  const g=new THREE.Group();
  const body=makeVoxelBox(1.7,0.55,0.85,color);
  body.position.y=0.38; g.add(body);
  const cabin=makeVoxelBox(0.9,0.45,0.7,0xf5f7ff);
  cabin.position.set(-0.1,0.85,0); g.add(cabin);
  const w1=makeVoxelBox(0.22,0.22,0.24,0x111111); w1.position.set(-0.55,0.18,0.42); g.add(w1);
  const w2=w1.clone(); w2.position.set(0.55,0.18,0.42); g.add(w2);
  const w3=w1.clone(); w3.position.set(-0.55,0.18,-0.42); g.add(w3);
  const w4=w1.clone(); w4.position.set(0.55,0.18,-0.42); g.add(w4);
  g.userData={speed:0, dir, len:1.7};
  return g;
}
function createLog(len){
  const g=new THREE.Group();
  const base=makeVoxelBox(len,0.35,0.9,0x6d4c41);
  base.position.y=0.18; g.add(base);
  const dark=makeVoxelBox(len*0.85,0.12,0.6,0x5d4037);
  dark.position.y=0.32; g.add(dark);
  for(let i=0;i<3;i++){
    const knot=makeVoxelBox(0.18,0.08,0.18,0x4e342e);
    knot.position.set((Math.random()-0.5)*len*0.6,0.38,(Math.random()-0.5)*0.3);
    g.add(knot);
  }
  g.userData={len};
  return g;
}
function createCoinMesh(x,z){
  const g=new THREE.Group();
  const base=makeVoxelBox(0.55,0.12,0.55,0xffde2e);
  base.position.y=0.45; g.add(base);
  const c=makeVoxelBox(0.22,0.14,0.06,0xe53935);
  c.position.set(0,0.52,0.02); g.add(c);
  const c2=makeVoxelBox(0.22,0.06,0.06,0xe53935); c2.position.set(-0.06,0.58,0.02); g.add(c2);
  const c3=makeVoxelBox(0.22,0.06,0.06,0xe53935); c3.position.set(-0.06,0.46,0.02); g.add(c3);
  g.position.set(x*TILE,0,z);
  g.userData={x, collected:false, baseY:0.45, t:Math.random()*Math.PI*2};
  return g;
}

function init(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0xaee8ff);
  scene.fog=new THREE.Fog(0xaee8ff, 22, 44);

  camera=new THREE.PerspectiveCamera(36, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(6,9,8);

  renderer=new THREE.WebGLRenderer({antialias:true, alpha:false});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  document.getElementById('canvasWrap').appendChild(renderer.domElement);

  ambient=new THREE.AmbientLight(0xffffff,0.72);
  scene.add(ambient);
  dirLight=new THREE.DirectionalLight(0xffffff,0.95);
  dirLight.position.set(8,18,6);
  dirLight.castShadow=true;
  dirLight.shadow.mapSize.set(2048,2048);
  dirLight.shadow.camera.left=-18; dirLight.shadow.camera.right=18;
  dirLight.shadow.camera.top=18; dirLight.shadow.camera.bottom=-18;
  dirLight.shadow.camera.near=1; dirLight.shadow.camera.far=40;
  scene.add(dirLight);

  playerGroup=createChicken();
  scene.add(playerGroup);

  window.addEventListener('resize', onResize);
  window.addEventListener('keydown', onKey);
  let ts=null;
  window.addEventListener('touchstart', e=>{ ts={x:e.touches[0].clientX, y:e.touches[0].clientY}; });
  window.addEventListener('touchend', e=>{
    if(!ts) return;
    const dx=e.changedTouches[0].clientX-ts.x;
    const dy=e.changedTouches[0].clientY-ts.y;
    if(Math.abs(dx)<20 && Math.abs(dy)<20) return;
    if(Math.abs(dx)>Math.abs(dy)){
      if(dx>0) tryMove(1,0); else tryMove(-1,0);
    }else{
      if(dy<0) tryMove(0,1); else tryMove(0,-1);
    }
    ts=null;
  });

  document.querySelectorAll('.mBtn').forEach(b=>{
    b.addEventListener('touchstart', e=>{ e.preventDefault(); const d=b.dataset.d; if(d==='u')tryMove(0,1); if(d==='d')tryMove(0,-1); if(d==='l')tryMove(-1,0); if(d==='r')tryMove(1,0); });
    b.addEventListener('click', ()=>{ const d=b.dataset.d; if(d==='u')tryMove(0,1); if(d==='d')tryMove(0,-1); if(d==='l')tryMove(-1,0); if(d==='r')tryMove(1,0); });
  });

  document.getElementById('playBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  resetWorld();
  animate();
}

function onResize(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function resetWorld(){
  lanes.forEach(l=>{
    scene.remove(l.base);
    l.obstacles.forEach(o=>scene.remove(o));
    l.vehicles.forEach(v=>scene.remove(v.mesh));
  });
  coins.forEach(c=>scene.remove(c));
  lanes=[]; coins=[]; particles=[];
  gridX=0; gridZ=0; targetX=0; targetZ=0; startX=0; startZ=0;
  isHopping=false; hopT=0; score=0; maxZ=0; coinScore=0; onLog=null; idleTime=0;
  playerGroup.position.set(0,0,0);
  camTarget.set(0,0,0);
  generateLanes(-8, 32);
  updateHUD();
}

function laneColor(type, idx){
  if(type==='grass') return idx%2===0?0x8ed152:0x7fc242;
  if(type==='road') return 0x525866;
  return 0x4fd1ff;
}

function randomLaneType(idx, prev){
  if(idx<SAFE_START) return 'grass';
  if(prev && prev.type=== 'road' || prev.type==='water'){
    // avoid 4 same
    let streak=1;
    for(let i=lanes.length-1;i>=0 && lanes[i].type===prev.type;i--) streak++;
    if(streak>=3) return prev.type==='road' ? (Math.random()<0.6?'grass':'water') : (Math.random()<0.6?'grass':'road');
  }
  const r=Math.random();
  if(r<0.38) return 'grass';
  if(r<0.69) return 'road';
  return 'water';
}

function generateLanes(from, to){
  for(let i=from;i<to;i++){
    if(lanes.find(l=>l.index===i)) continue;
    const prev=lanes.length? lanes[lanes.length-1]: null;
    const type=randomLaneType(i, prev);
    const baseGeom=new THREE.BoxGeometry(WORLD_W*2, 0.3, TILE*0.98);
    const mat=new THREE.MeshLambertMaterial({color:laneColor(type,i)});
    const base=new THREE.Mesh(baseGeom, mat);
    base.position.set(0,-0.15,-i*TILE);
    base.receiveShadow=true;
    scene.add(base);

    const lane={index:i, type, base, obstacles:[], vehicles:[], z:-i*TILE, dir: Math.random()<0.5?1:-1};

    if(type==='road'){
      // dashed lines
      for(let lx=-10; lx<=10; lx+=2){
        const line=makeVoxelBox(0.9,0.02,0.08,0xb8becf);
        line.position.set(lx*TILE,0.01,-i*TILE);
        scene.add(line);
        lane.obstacles.push(line);
      }
      lane.dir = Math.random()<0.5?1:-1;
      const count= 2 + Math.floor(Math.random()*2);
      const speed=(0.025+Math.random()*0.045)*lane.dir;
      for(let k=0;k<count;k++){
        const col=[0xff6b35,0x7ed957,0x4fc3f7,0xffde59,0xff8fab,0x9c8cff][Math.floor(Math.random()*6)];
        const car=createCar(col, lane.dir);
        car.position.set((Math.random()*20-10)*TILE,0,-i*TILE);
        car.userData.speed=speed*(0.8+Math.random()*0.4);
        scene.add(car);
        lane.vehicles.push({mesh:car, speed:car.userData.speed});
      }
    } else if(type==='water'){
      lane.dir = Math.random()<0.5?1:-1;
      const speed=(0.018+Math.random()*0.03)*lane.dir;
      const count= 2+Math.floor(Math.random()*2);
      for(let k=0;k<count;k++){
        const len=2.6+Math.random()*3.2;
        const log=createLog(len);
        log.position.set((Math.random()*18-9)*TILE,0,-i*TILE);
        log.userData.speed=speed*(0.8+Math.random()*0.4);
        log.userData.len=len;
        scene.add(log);
        lane.vehicles.push({mesh:log, speed:log.userData.speed, len});
      }
    } else {
      // grass obstacles
      const treeCount= 2+Math.floor(Math.random()*4);
      const occupied=new Set();
      occupied.add(0);
      if(i<2){ occupied.add(1); occupied.add(-1); }
      for(let t=0;t<treeCount;t++){
        let x;
        let tries=0;
        do{ x=Math.floor(Math.random()* (WORLD_W*2-2) - WORLD_W+1); tries++; }while(occupied.has(x) && tries<20);
        if(occupied.has(x)) continue;
        occupied.add(x);
        let obj;
        if(Math.random()<0.75) obj=createTree(x, -i*TILE);
        else obj=createRock(x, -i*TILE);
        scene.add(obj);
        lane.obstacles.push(obj);
      }
      // occasional coin
      if(Math.random()<0.55 && i>2){
        let cx;
        let tries=0;
        do{ cx=Math.floor(Math.random()* (WORLD_W*1.2) - WORLD_W*0.6); tries++; }while(occupied.has(cx) && tries<15);
        if(!occupied.has(cx)){
          const cm=createCoinMesh(cx, -i*TILE);
          scene.add(cm);
          coins.push(cm);
          lane.coins=lane.coins||[]; lane.coins.push(cm);
        }
      }
    }
    lanes.push(lane);
  }
  lanes.sort((a,b)=>a.index-b.index);
}

function tryMove(dx,dz){
  if(gameState!=='playing' || isHopping) return;
  if(gameState==='start') return;
  const nx=gridX+dx;
  const nz=gridZ+dz;
  if(Math.abs(nx)>10) return;
  if(nz< -2) return;
  // check lane exists
  let lane=lanes.find(l=>l.index===nz);
  if(!lane){
    generateLanes(nz, nz+10);
    lane=lanes.find(l=>l.index===nz);
  }
  if(!lane) return;
  if(lane.type==='grass'){
    const blocked=lane.obstacles.some(o=>o.userData && (o.userData.type==='tree' || o.userData.type==='rock') && o.userData.x===nx);
    if(blocked){
      // bump
      tone(120,0.08,'square',0.12);
      playerGroup.position.x+=dx*0.08;
      setTimeout(()=>{ if(playerGroup) playerGroup.position.x=targetX*TILE; },70);
      return;
    }
  }
  if(lane.type==='water'){
    // need log at destination at this moment
    const logs=lane.vehicles;
    let hasLog=false;
    for(const v of logs){
      const lx=v.mesh.position.x / TILE;
      if(Math.abs(lx - nx) < v.len/2 + 0.3){ hasLog=true; break; }
    }
    if(!hasLog && dz!==0){
      // allow jump but will die quickly - still check if immediate log? we already checked
      // if no log, we will let jump but death will trigger
    }
  }
  // start hop
  startX=targetX; startZ=targetZ;
  targetX=nx; targetZ=nz;
  gridX=nx; // for immediate score? but final after hop
  // gridZ updated after landing to allow scoring only forward?
  isHopping=true; hopT=0;
  idleTime=0;
  onLog=null;
  playHop();
  if(dz>0){
    // facing forward
    playerGroup.rotation.y=0;
  }else if(dz<0) playerGroup.rotation.y=Math.PI;
  else if(dx>0) playerGroup.rotation.y=-Math.PI/2;
  else if(dx<0) playerGroup.rotation.y=Math.PI/2;
}

function onKey(e){
  if(e.repeat) return;
  if(e.code==='ArrowUp' || e.code==='KeyW') tryMove(0,1);
  else if(e.code==='ArrowDown' || e.code==='KeyS') tryMove(0,-1);
  else if(e.code==='ArrowLeft' || e.code==='KeyA') tryMove(-1,0);
  else if(e.code==='ArrowRight' || e.code==='KeyD') tryMove(1,0);
  else if(e.code==='Space' && gameState!=='playing') startGame();
}

function startGame(){
  audioInit();
  resetWorld();
  gameState='playing';
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  $eagle.classList.remove('show');
  clock.getDelta();
}

function die(reason){
  if(gameState!=='playing') return;
  gameState='gameOver';
  shake=0.9;
  if(reason==='car') playCrash();
  else if(reason==='water') playSplash();
  else playCrash();
  const final=document.getElementById('finalScoreNum');
  final.textContent=score;
  document.getElementById('bestScore').textContent=Math.max(best,score);
  document.getElementById('finalCoins').textContent=coinScore;
  document.getElementById('overReason').textContent= reason==='car'?'Smashed by traffic!': reason==='water'?'Sank in the river!': reason==='eagle'?'Snatched by the eagle! Stay moving!':'Off the map!';
  document.getElementById('overTitle').textContent= reason==='eagle'?'EAGLE!' : reason==='water'?'SPLASH!':'SPLAT!';
  best=Math.max(best,score);
  setTimeout(()=>{
    document.getElementById('gameOverScreen').classList.remove('hidden');
  }, 500);
}

function updateHUD(){
  $score.textContent=score;
  $coin.textContent=coinScore;
  const pct=Math.min(100, (score/120)*100 + 5);
  $pBar.style.height=pct+'%';
}

function spawnParticles(pos, color){
  for(let i=0;i<10;i++){
    const p=makeVoxelBox(0.14,0.14,0.14,color);
    p.position.copy(pos);
    p.position.y+=0.5;
    scene.add(p);
    particles.push({mesh:p, vel:new THREE.Vector3((Math.random()-0.5)*0.12, 0.08+Math.random()*0.12, (Math.random()-0.5)*0.12), life:1});
  }
}

function animate(){
  requestAnimationFrame(animate);
  const delta=clock.getDelta();
  const elapsed=clock.elapsedTime;

  if(gameState==='playing'){
    idleTime+=delta;
    if(idleTime>3.5 && !isHopping){
      $eagle.classList.add('show');
      if(idleTime>5){
        die('eagle');
      }
    } else {
      $eagle.classList.remove('show');
    }

    // hop animation
    if(isHopping){
      hopT+=delta*9;
      if(hopT>=1){
        hopT=1;
        isHopping=false;
        targetZ=Math.round(targetZ);
        targetX=Math.round(targetX);
        gridZ=targetZ;
        if(gridZ>maxZ){
          maxZ=gridZ;
          score=maxZ;
          updateHUD();
          if(maxZ%12===0) tone(600,0.1,'sine',0.15);
          // generate ahead
          generateLanes(maxZ+12, maxZ+28);
        }
        playerGroup.position.set(targetX*TILE,0,-targetZ*TILE);
        // coin check
        for(let i=coins.length-1;i>=0;i--){
          const c=coins[i];
          if(c.userData.collected) continue;
          const cz=Math.round(-c.position.z / TILE);
          if(cz===gridZ && Math.abs(c.position.x/TILE - gridX)<0.6){
            c.userData.collected=true;
            scene.remove(c);
            coins.splice(i,1);
            coinScore++;
            updateHUD();
            playCoin();
            spawnParticles(playerGroup.position.clone(), 0xffde2e);
          }
        }
        // cleanup old lanes
        lanes=lanes.filter(l=>{
          if(l.index < gridZ-12){
            scene.remove(l.base);
            l.obstacles.forEach(o=>scene.remove(o));
            l.vehicles.forEach(v=>scene.remove(v.mesh));
            return false;
          }
          return true;
        });
      }else{
        const t=hopT;
        const x=THREE.MathUtils.lerp(startX, targetX, t)*TILE;
        const z=THREE.MathUtils.lerp(startZ, targetZ, t)*-TILE;
        const y=Math.sin(t*Math.PI)*0.7;
        playerGroup.position.set(x,y,z);
        // squash stretch
        const s=1+Math.sin(t*Math.PI)*0.18;
        playerGroup.scale.set(1, s, 1);
      }
    } else {
      playerGroup.scale.lerp(new THREE.Vector3(1,1,1), 0.2);
    }

    // move cars/logs
    for(const lane of lanes){
      if(lane.type==='road' || lane.type==='water'){
        for(const v of lane.vehicles){
          v.mesh.position.x+=v.speed*delta*60;
          // wrap
          if(v.speed>0 && v.mesh.position.x> (WORLD_W+3)*TILE) v.mesh.position.x=-(WORLD_W+3)*TILE;
          if(v.speed<0 && v.mesh.position.x< -(WORLD_W+3)*TILE) v.mesh.position.x=(WORLD_W+3)*TILE;
        }
      }
    }

    // check water/log riding and car collisions
    if(!isHopping){
      const curLane=lanes.find(l=>l.index===gridZ);
      if(curLane){
        if(curLane.type==='water'){
          let found=null;
          for(const v of curLane.vehicles){
            const lx=v.mesh.position.x;
            if(Math.abs(lx - playerGroup.position.x) < (v.len*TILE)/2 + 0.2){
              found=v;
              break;
            }
          }
          if(found){
            onLog=found;
            // carry
            playerGroup.position.x+=found.speed*delta*60;
            targetX=playerGroup.position.x / TILE;
            gridX=Math.round(targetX);
            // off screen death
            if(Math.abs(playerGroup.position.x) > (WORLD_W+0.5)*TILE){
              die('water');
            }
          }else{
            // drown
            playerGroup.position.y-=delta*3;
            if(playerGroup.position.y < -1){
              die('water');
            }
          }
        } else if(curLane.type==='road'){
          for(const v of curLane.vehicles){
            if(Math.abs(v.mesh.position.x - playerGroup.position.x) < 0.9 && Math.abs(v.mesh.position.z - playerGroup.position.z) < 0.45){
              // hit
              spawnParticles(playerGroup.position.clone(), 0xff4a4a);
              die('car');
            }
          }
          onLog=null;
        } else {
          onLog=null;
        }
      }
    }

    // coins bob
    for(const c of coins){
      c.userData.t+=delta*3;
      c.position.y=Math.sin(c.userData.t)*0.15;
      c.rotation.y+=delta*2;
    }

    // particles
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.mesh.position.add(p.vel);
      p.vel.y-=0.008;
      p.life-=delta*1.8;
      p.mesh.rotation.x+=0.2; p.mesh.rotation.y+=0.2;
      if(p.life<=0){ scene.remove(p.mesh); particles.splice(i,1); }
    }

    // camera follow
    const desired=new THREE.Vector3(targetX*TILE + 5.5, 8.5, -targetZ*TILE + 6.5);
    camera.position.lerp(desired, delta*3);
    const lookAt=new THREE.Vector3(targetX*TILE, 0.5, -targetZ*TILE -1);
    camTarget.lerp(lookAt, delta*4);
    camera.lookAt(camTarget);

    if(shake>0){
      camera.position.x+= (Math.random()-0.5)*shake;
      camera.position.y+= (Math.random()-0.5)*shake;
      shake*=0.9;
      if(shake<0.01) shake=0;
    }

  } else if(gameState==='start'){
    // idle camera sway
    const t=elapsed*0.4;
    camera.position.x=6+Math.sin(t)*0.6;
    camera.position.z=8+Math.cos(t)*0.4;
    camera.lookAt(0,0.5,0);
    playerGroup.rotation.y=Math.sin(elapsed*1.2)*0.3;
    playerGroup.position.y=Math.sin(elapsed*2)*0.08;
  }

  renderer.render(scene,camera);
}

init();
</script>
